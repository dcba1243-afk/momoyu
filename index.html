<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛毛宇家的金庫2.0</title>
    <style>
        :root {
            --bg-color: #f4f6f4;          /* 淡淡的森林大地灰綠 */
            --card-bg: #ffffff;
            --text-main: #2d3a2e;         /* 深橡木綠 */
            --text-sub: #607261;          /* 苔蘚綠 */
            --primary: #d97736;           /* 松果暖橘 */
            --primary-light: #fdf2eb;     /* 暖橘淡背景 */
            --renyu-color: #4a7c59;       /* 仁宇：常青樹綠 */
            --maozi-color: #e28743;       /* 毛子：秋楓橘 */
            --card-color: #5b8296;        /* 家庭帳戶金融卡：莫蘭迪藍 */
            --success-color: #2b8a3e;     /* 已核銷綠 */
            --border: #e2ede4;            /* 淺綠邊框 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 24px 0;
        }

        header h1 {
            font-size: 22px;
            color: var(--text-main);
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        header p {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* 儀表板與結算區 */
        .dashboard {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(45, 58, 46, 0.04);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .total-box {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border);
        }

        .total-label {
            font-size: 13px;
            color: var(--text-sub);
        }

        .total-amount {
            font-size: 30px;
            font-weight: bold;
            color: var(--primary);
            margin-top: 4px;
        }

        .fund-info {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .split-grid {
            display: table;
            width: 100%;
            margin-bottom: 12px;
        }

        .split-col {
            display: table-cell;
            width: 50%;
            text-align: center;
        }

        .split-col:first-child {
            border-right: 1px solid var(--border);
        }

        .member-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .member-name.renyu { color: var(--renyu-color); }
        .member-name.maozi { color: var(--maozi-color); }

        .member-amount {
            font-size: 18px;
            font-weight: bold;
        }
        
        .member-subnote {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .settlement-alert {
            background-color: var(--primary-light);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 8px;
            border: 1px solid #fadcc8;
        }

        /* 表單區 */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(45, 58, 46, 0.04);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 16px;
            color: var(--text-main);
            border-left: 4px solid var(--renyu-color);
            padding-left: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fafbfa;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--renyu-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
        }

        .radio-group {
            display: flex;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .radio-label {
            flex: 1;
            text-align: center;
            padding: 12px 4px;
            cursor: pointer;
            font-size: 13px;
            background: #fff;
            font-weight: 500;
            transition: all 0.2s;
            border-right: 1px solid var(--border);
        }

        .radio-label:last-child {
            border-right: none;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + .radio-label.ry-btn {
            background-color: var(--renyu-color);
            color: white;
            border-color: var(--renyu-color);
        }

        input[type="radio"]:checked + .radio-label.mz-btn {
            background-color: var(--maozi-color);
            color: white;
            border-color: var(--maozi-color);
        }

        input[type="radio"]:checked + .radio-label.cd-btn {
            background-color: var(--card-color);
            color: white;
            border-color: var(--card-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--renyu-color); 
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(74, 124, 89, 0.15);
            transition: all 0.2s;
        }

        .btn-submit:active {
            background-color: #3b6347;
        }

        .btn-submit:disabled {
            background-color: var(--text-sub);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 歷史明細 */
        .history-list {
            list-style: none;
        }

        .history-item {
            display: table;
            width: 100%;
            padding: 14px 0;
            border-bottom: 1px solid #edf2ee;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .item-main {
            display: table-cell;
            vertical-align: middle;
        }

        .item-title {
            font-size: 14px;
            font-weight: 500;
        }
        
        .item-title.strikethrough {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .item-meta {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .item-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: white;
            margin-right: 4px;
            font-weight: 500;
        }

        .item-badge.ry { background-color: var(--renyu-color); }
        .item-badge.mz { background-color: var(--maozi-color); }
        .item-badge.cd { background-color: var(--card-color); }

        .item-right {
            display: table-cell;
            text-align: right;
            vertical-align: middle;
            width: 110px;
        }

        .item-amount {
            font-weight: bold;
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 4px;
        }
        
        /* 審核按鈕樣式 */
        .btn-audit {
            background-color: #f1f3f1;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-audit:hover {
            background-color: var(--primary-light);
            color: var(--primary);
        }
        
        .status-settled {
            color: var(--success-color);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 0;
        }
        
        .pay-date-text {
            display: block;
            font-size: 9px;
            color: #889c89;
            font-weight: normal;
            margin-top: 1px;
        }
        
        .status-none {
            color: #90a4ae;
            font-size: 11px;
            font-style: italic;
        }
        
        .loading-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            padding: 16px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌲 毛毛宇家的金庫2.0</h1>
        <p>一起堅固我們家</p>
    </header>

    <div class="dashboard">
        <div class="total-box">
            <div class="total-label">⚖️ 家庭基金剩餘可用</div>
            <div class="total-amount">NT$ <span id="fundBalance">0</span></div>
            <div class="fund-info" id="fundInfoText">本月已花了: NT$ 0</div>
        </div>
        <div class="split-grid">
            <div class="split-col">
                <div class="member-name renyu">🌲 未結算補款 (仁宇)</div>
                <div class="member-amount" id="renyuRefund">NT$ 0</div>
                <div class="member-subnote">已扣除已撥款項</div>
            </div>
            <div class="split-col">
                <div class="member-name maozi">🍊 未結算補款 (毛子)</div>
                <div class="member-amount" id="maoziRefund">NT$ 0</div>
                <div class="member-subnote">已扣除已撥款項</div>
            </div>
        </div>
        <div class="settlement-alert" id="settlementText">
            正在與金庫連線中...
        </div>
    </div>

    <div class="card">
        <div class="card-title">新增花費</div>
        <form id="expenseForm">
            <div class="form-group">
                <label>付款方式</label>
                <div class="radio-group">
                    <input type="radio" id="payByRenyu" name="payer" value="仁宇代墊" checked>
                    <label for="payByRenyu" class="radio-label ry-btn">🌲 仁宇代墊</label>
                    
                    <input type="radio" id="payByMaozi" name="payer" value="毛子代墊">
                    <label for="payByMaozi" class="radio-label mz-btn">🍊 毛子代墊</label>

                    <input type="radio" id="payByCard" name="payer" value="家庭帳戶金融卡直刷">
                    <label for="payByCard" class="radio-label cd-btn">💳 家庭帳戶金融卡</label>
                </div>
            </div>

            <div class="form-group">
                <label for="amount">金額 (NT$)</label>
                <input type="number" id="amount" class="form-control" placeholder="請輸入金額" required pattern="[0-9]*" inputmode="numeric">
            </div>

            <div class="form-group">
                <label for="purpose">品項 / 用途</label>
                <input type="text" id="purpose" class="form-control" placeholder="例如：買菜、水電費" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">紀錄一筆</button>
        </form>
    </div>

    <div class="card">
        <div class="card-title">最近記帳明細 (點擊核銷可立即發錢)</div>
        <ul class="history-list" id="historyList">
            <div class="loading-text" id="loadingText">正在讀取最新帳目...</div>
        </ul>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwaTVZsxtJ_fUpM1Em624hvAEgvtrt0jgIjngZWPRqmKUYcnZ28McNPXA3OZoJdW64g/exec";

        /* =========================================================
         * 💰 預算設定區（第四點改善）
         * ---------------------------------------------------------
         * 以前預算數字散在函式裡（20900 / 17500 / 16643），
         * 現在集中在這裡。日後要調整只改這一區，不用動邏輯。
         *
         * DEFAULT_BUDGET  : 新制每月配額（2026/06 起生效）
         * LEGACY_BUDGET   : 舊制每月配額（2026/05 含以前）
         * NEW_SYSTEM_START: 新制生效的年月（含當月），格式 "YYYY-MM"
         * OPENING_SPENT   : 特定月份的「期初已花費」校正值。
         *                   用於處理導入系統前、帳外已花掉的金額。
         *                   key 格式 "YYYY-M"（月份不補零）。
         * ========================================================= */
        const BUDGET_CONFIG = {
            DEFAULT_BUDGET: 20900,
            LEGACY_BUDGET: 17500,
            NEW_SYSTEM_START: "2026-06",
            OPENING_SPENT: {
                "2026-5": 16643   // 5月導入系統前，帳外已花掉的金額
            }
        };

        let records = [];
        const form = document.getElementById('expenseForm');
        const submitBtn = document.getElementById('submitBtn');

        document.querySelectorAll('input[name="payer"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if(e.target.value === '仁宇代墊') {
                    submitBtn.style.backgroundColor = 'var(--renyu-color)';
                } else if(e.target.value === '毛子代墊') {
                    submitBtn.style.backgroundColor = 'var(--maozi-color)';
                } else {
                    submitBtn.style.backgroundColor = 'var(--card-color)';
                }
            });
        });

        // 將 "YYYY-M" / "YYYY-MM" 轉成可比較的整數，例如 202606
        function ymToNumber(year, month) {
            return year * 100 + month;
        }

        // 智能月份配額判定（改由 BUDGET_CONFIG 讀取，不再寫死數字）
        function getBudgetForMonth(targetYear, targetMonth) {
            const [startY, startM] = BUDGET_CONFIG.NEW_SYSTEM_START.split('-').map(Number);
            const startNum = ymToNumber(startY, startM);
            const targetNum = ymToNumber(targetYear, targetMonth);

            const total = (targetNum >= startNum)
                ? BUDGET_CONFIG.DEFAULT_BUDGET
                : BUDGET_CONFIG.LEGACY_BUDGET;

            const key = `${targetYear}-${targetMonth}`;
            const offset = BUDGET_CONFIG.OPENING_SPENT[key] || 0;

            return { total, offset, label: `${targetMonth}月基金` };
        }

        // 英文月份縮寫對照表（給 JS Date.toString() 格式用）
        const MONTH_ABBR = {
            jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6,
            jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12
        };

        /* =========================================================
         * 📅 日期解析（第三點改善）
         * ---------------------------------------------------------
         * 以前只硬切 "-" 或 "/" 的前兩段，格式一不符就悄悄把整筆
         * 資料算進「當月」，導致餘額被默默算錯。
         *
         * ⚠️ 你們試算表實際存的時間是這種格式：
         *   "Sun Jul 05 2026 21:45:09 GMT+0800 (台北標準時間)"
         * 它沒有 "-" 也沒有 "/"，月份是英文縮寫（Jul），
         * 所以這裡特別針對它抓「英文月份縮寫」，不經時區換算最穩。
         *
         * 現在改為多層嘗試，並在「真的解析不出來」時回傳 null，
         * 由呼叫端明確跳過並提示，而不是靜默污染當月數字。
         *
         * 支援格式範例：
         *   Sun Jul 05 2026 21:45:09 GMT+0800 (台北標準時間)
         *   2026-07-05 / 2026/7/5 / 2026.07.05 / 2026-07-05T10:30:00
         *   真正的 Date 物件
         * 回傳：{ year, month } 或 null
         * ========================================================= */
        function parseYearMonth(timeValue) {
            // 空值直接視為無法解析
            if (timeValue === null || timeValue === undefined || timeValue === '') {
                return null;
            }

            // 情況一：後端傳回真正的 Date 物件
            if (timeValue instanceof Date && !isNaN(timeValue.getTime())) {
                return { year: timeValue.getFullYear(), month: timeValue.getMonth() + 1 };
            }

            const str = timeValue.toString().trim();

            // 情況二：數字開頭的格式（ISO / 斜線 / 點），如 2026-07-05、2026/7/5
            // 用 ^ 錨定「開頭」的 4 位年份，避免誤抓到後面時間裡的數字（如小時）
            const numMatch = str.match(/^\s*(\d{4})\D+(\d{1,2})/);
            if (numMatch) {
                const year = parseInt(numMatch[1], 10);
                const month = parseInt(numMatch[2], 10);
                if (year >= 2000 && year <= 2100 && month >= 1 && month <= 12) {
                    return { year, month };
                }
            }

            // 情況三：JS Date.toString() 格式，直接抓「英文月份縮寫 + 4 位年份」
            // 不透過 new Date()，可避開跨月午夜的時區位移問題
            const abbrMatch = str.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/i);
            const yearMatch = str.match(/\b(19|20)\d{2}\b/);
            if (abbrMatch && yearMatch) {
                const month = MONTH_ABBR[abbrMatch[1].toLowerCase()];
                const year = parseInt(yearMatch[0], 10);
                if (month && year >= 2000 && year <= 2100) {
                    return { year, month };
                }
            }

            // 情況四：最後交給瀏覽器原生 Date 解析（處理其他標準格式）
            const d = new Date(str);
            if (!isNaN(d.getTime())) {
                return { year: d.getFullYear(), month: d.getMonth() + 1 };
            }

            // 真的解析不出來
            return null;
        }

        function fetchCloudData() {
            if(API_URL === "" || API_URL.includes("這裡替換成")) {
                document.getElementById('settlementText').innerText = "💡 請先在程式碼中填入你的 GAS 網址喔！";
                return;
            }
            
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    records = data;
                    const loadingText = document.getElementById('loadingText');
                    if(loadingText) loadingText.remove();
                    updateUI();
                })
                .catch(error => {
                    console.error("讀取失敗:", error);
                    document.getElementById('settlementText').innerText = "❌ 金庫讀取失敗，請重新整理";
                });
        }
        
        // 把各種可能的付款人寫法統一成顯示名稱、徽章樣式與分類
        function classifyPayer(payer) {
            if (payer === '仁宇代墊' || payer === '仁宇' || payer === '老公') {
                return { displayPayer: '仁宇代墊', badgeClass: 'ry', kind: 'ry' };
            }
            if (payer === '毛子代墊' || payer === '毛子' || payer === '老婆') {
                return { displayPayer: '毛子代墊', badgeClass: 'mz', kind: 'mz' };
            }
            return { displayPayer: '家庭帳戶金融卡直刷', badgeClass: 'cd', kind: 'cd' };
        }

        // 取得可排序的時間戳（給明細排序用）。排序容忍度高，直接用 new Date 即可；
        // 解析不出來的給 0，讓它排到最後，不會影響金額計算。
        function getSortableTime(res) {
            if (!res || !res.time) return 0;
            const t = new Date(res.time).getTime();
            return isNaN(t) ? 0 : t;
        }

        // 把冗長的時間字串縮短成清爽格式：當年 → "07/05"；跨年 → "2025/12/31"
        // 若真的解析不出來，就退回顯示原字串，不弄丟資訊。
        function formatDisplayDate(timeValue) {
            if (!timeValue) return '';
            const d = new Date(timeValue);
            if (isNaN(d.getTime())) return timeValue.toString();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const yearPrefix = d.getFullYear() !== new Date().getFullYear()
                ? `${d.getFullYear()}/` : '';
            return `${yearPrefix}${mm}/${dd}`;
        }

        function updateUI() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1; // 2026年7月

            const budgetInfo = getBudgetForMonth(currentYear, currentMonth);
            
            let totalSpent = budgetInfo.offset;   
            let ryUnpaid = 0;     
            let mzUnpaid = 0;     

            // 收集「日期無法辨識」的資料，稍後提示使用者（不再靜默算進當月）
            const unparsedRecords = [];

            /* ---------------------------------------------------------
             * 第一部分：金額計算（只算「當月」）
             * 家庭基金餘額、未結算補款維持原本的當月邏輯，不受明細顯示影響。
             * --------------------------------------------------------- */
            records.forEach(res => {
                const ym = parseYearMonth(res.time);

                // 🛑 解析失敗：明確跳過並記錄，避免壞資料混進本月花費
                if (!ym) {
                    unparsedRecords.push(res);
                    console.warn("日期無法辨識，已略過此筆：", res);
                    return;
                }

                // 只計算當月的資料
                if (ym.year !== currentYear || ym.month !== currentMonth) {
                    return;
                }

                totalSpent += res.amount;

                const isSettled = res.status === '已撥款';
                const { kind } = classifyPayer(res.payer);
                if (kind === 'ry' && !isSettled) ryUnpaid += res.amount;
                if (kind === 'mz' && !isSettled) mzUnpaid += res.amount;
            });

            /* ---------------------------------------------------------
             * 第二部分：明細顯示（最近 10 筆，不分月份、不論是否撥款）
             * 依時間新到舊排序後取前 10 筆。
             * --------------------------------------------------------- */
            const listElement = document.getElementById('historyList');
            listElement.innerHTML = '';

            const recentRecords = [...records]
                .sort((a, b) => getSortableTime(b) - getSortableTime(a))
                .slice(0, 10);

            if (recentRecords.length === 0) {
                listElement.innerHTML = `<div class="loading-text">還沒有任何記帳，來記第一筆吧！</div>`;
            } else {
                recentRecords.forEach(res => {
                    const isSettled = res.status === '已撥款';
                    const { displayPayer, badgeClass } = classifyPayer(res.payer);

                    const li = document.createElement('li');
                    li.className = 'history-item';

                    let auditHtml = '';
                    if (displayPayer === '家庭帳戶金融卡直刷') {
                        auditHtml = `<span class="status-none">💳 無需撥款</span>`;
                    } else if (isSettled) {
                        auditHtml = `<span class="status-settled">✓ 已撥款<span class="pay-date-text">📅 ${res.payDate || '已完成'}</span></span>`;
                    } else {
                        auditHtml = `<button class="btn-audit" onclick="auditRow(${res.rowId}, this)">⚙ 點擊撥款</button>`;
                    }

                    const titleClass = isSettled ? "item-title strikethrough" : "item-title";

                    li.innerHTML = `
                        <div class="item-main">
                            <div class="${titleClass}">${res.purpose}</div>
                            <div class="item-meta">
                                <span class="item-badge ${badgeClass}">${displayPayer}</span>
                                <span style="color:#a0b2a1;">${formatDisplayDate(res.time)}</span>
                            </div>
                        </div>
                        <div class="item-right">
                            <div class="item-amount">NT$ ${res.amount.toLocaleString()}</div>
                            <div class="audit-zone">${auditHtml}</div>
                        </div>
                    `;
                    listElement.appendChild(li);
                });
            }

            const remainingBalance = budgetInfo.total - totalSpent;

            document.getElementById('fundBalance').innerText = remainingBalance.toLocaleString();

            // 「本月已花了」；若有無法辨識日期的資料，附上提示讓問題浮現
            let infoText = `${currentMonth}月已花了: NT$ ${totalSpent.toLocaleString()}`;
            if (unparsedRecords.length > 0) {
                infoText += ` ⚠️ 有 ${unparsedRecords.length} 筆日期無法辨識(已略過)`;
            }
            document.getElementById('fundInfoText').innerText = infoText;
            
            document.getElementById('renyuRefund').innerText = 'NT$ ' + ryUnpaid.toLocaleString();
            document.getElementById('maoziRefund').innerText = 'NT$ ' + mzUnpaid.toLocaleString();

            const settlementAlert = document.getElementById('settlementText');
            if (remainingBalance < 0) {
                settlementAlert.innerHTML = `⚠️ 警告：${currentMonth}月基金已透支 NT$ ${Math.abs(remainingBalance).toLocaleString()}！`;
                settlementAlert.style.color = '#d93636';
                settlementAlert.style.backgroundColor = '#fdebeb';
                settlementAlert.style.borderColor = '#fab8b8';
            } else {
                settlementAlert.innerHTML = `✨ 運作良好！${currentMonth}月已攜手分攤了 NT$ ${(totalSpent - budgetInfo.offset).toLocaleString()} 的家庭基建。`;
                settlementAlert.style.color = 'var(--primary)';
                settlementAlert.style.backgroundColor = 'var(--primary-light)';
                settlementAlert.style.borderColor = '#fadcc8';
            }
        }

        function auditRow(rowId, buttonElement) {
            if(!confirm("確定已將這筆代墊款撥款給對方了嗎？\n確認後將自動紀錄今日撥款日期。")) return;
            
            buttonElement.disabled = true;
            buttonElement.innerText = "同步中...";
            
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "updateStatus",
                    rowId: rowId
                })
            })
            .then(res => res.json())
            .then(result => {
                if(result.result === "success") {
                    const recordIndex = records.findIndex(r => r.rowId === rowId);
                    if(recordIndex !== -1) {
                        records[recordIndex].status = "已撥款";
                        records[recordIndex].payDate = result.payDate;
                    }
                    updateUI();
                } else {
                    alert("核銷失敗，請重試！");
                    buttonElement.disabled = false;
                    buttonElement.innerText = "⚙ 點擊撥款";
                }
            })
            .catch(err => {
                console.error("同步失敗:", err);
                alert("網路異常");
                buttonElement.disabled = false;
                buttonElement.innerText = "⚙ 點擊撥款";
            });
        }

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const payer = document.querySelector('input[name="payer"]:checked').value;
            const amount = parseInt(document.getElementById('amount').value, 10);
            const purpose = document.getElementById('purpose').value;

            if(!amount || !purpose) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "正在同步至金庫...";

            const newData = { payer, amount, purpose };

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(newData)
            })
            .then(res => res.json())
            .then(result => {
                if(result.result === "success") {
                    fetchCloudData();
                    document.getElementById('amount').value = '';
                    document.getElementById('purpose').value = '';
                } else {
                    alert("儲存失敗，請重試！");
                }
            })
            .catch(err => {
                console.error("同步失敗:", err);
                alert("連線異常");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "紀錄一筆";
            });
        });

        fetchCloudData();
    </script>
</body>
</html>
