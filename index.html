<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛毛宇家的金庫2.0</title>
    <style>
        :root {
            --bg-color: #f4f6f4;
            --card-bg: #ffffff;
            --text-main: #2d3a2e;
            --text-sub: #607261;
            --primary: #d97736;
            --primary-light: #fdf2eb;
            --renyu-color: #4a7c59;
            --maozi-color: #e28743;
            --card-color: #5b8296;
            --success-color: #2b8a3e;
            --border: #e2ede4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        header { text-align: center; padding: 24px 0; }
        header h1 { font-size: 22px; color: var(--text-main); letter-spacing: 1.5px; font-weight: 700; }
        header p { font-size: 13px; color: var(--text-sub); margin-top: 6px; letter-spacing: 0.5px; }

        .dashboard {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(45, 58, 46, 0.04);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .total-box {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border);
        }
        .total-label { font-size: 13px; color: var(--text-sub); }
        .total-amount { font-size: 30px; font-weight: bold; color: var(--primary); margin-top: 4px; }
        .fund-info { font-size: 12px; color: var(--text-sub); margin-top: 2px; }

        .split-grid { display: table; width: 100%; margin-bottom: 12px; }
        .split-col { display: table-cell; width: 50%; text-align: center; vertical-align: top; padding: 0 6px; }
        .split-col:first-child { border-right: 1px solid var(--border); }

        .member-name { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
        .member-name.renyu { color: var(--renyu-color); }
        .member-name.maozi { color: var(--maozi-color); }
        .member-amount { font-size: 18px; font-weight: bold; }
        .member-subnote { font-size: 10px; color: var(--text-sub); margin-top: 2px; }

        /* 一鍵撥款按鈕 */
        .btn-settle {
            margin-top: 10px;
            width: 100%;
            border: none;
            border-radius: 8px;
            padding: 9px 6px;
            font-size: 12px;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .btn-settle.ry { background-color: var(--renyu-color); }
        .btn-settle.mz { background-color: var(--maozi-color); }
        .btn-settle:disabled { background-color: #cfd8d1; cursor: default; }

        .settlement-alert {
            background-color: var(--primary-light);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 8px;
            border: 1px solid #fadcc8;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(45, 58, 46, 0.04);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 16px;
            color: var(--text-main);
            border-left: 4px solid var(--renyu-color);
            padding-left: 8px;
        }

        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 13px; color: var(--text-sub); margin-bottom: 6px; }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fafbfa;
            outline: none;
            transition: all 0.2s;
        }
        .form-control:focus {
            border-color: var(--renyu-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
        }

        .radio-group { display: flex; width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); }
        .radio-label {
            flex: 1;
            text-align: center;
            padding: 12px 4px;
            cursor: pointer;
            font-size: 13px;
            background: #fff;
            font-weight: 500;
            transition: all 0.2s;
            border-right: 1px solid var(--border);
        }
        .radio-label:last-child { border-right: none; }
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .radio-label.ry-btn { background-color: var(--renyu-color); color: white; }
        input[type="radio"]:checked + .radio-label.mz-btn { background-color: var(--maozi-color); color: white; }
        input[type="radio"]:checked + .radio-label.cd-btn { background-color: var(--card-color); color: white; }

        .btn-submit {
            width: 100%;
            background-color: var(--renyu-color);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(74, 124, 89, 0.15);
            transition: all 0.2s;
        }
        .btn-submit:active { background-color: #3b6347; }
        .btn-submit:disabled { background-color: var(--text-sub); cursor: not-allowed; box-shadow: none; }

        /* 明細分頁 */
        .tabs { display: flex; gap: 8px; margin-bottom: 12px; }
        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text-sub);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .tab-btn.active { background: var(--text-main); color: #fff; border-color: var(--text-main); }

        .history-list { list-style: none; }
        .history-item { display: table; width: 100%; padding: 14px 0; border-bottom: 1px solid #edf2ee; }
        .history-item:last-child { border-bottom: none; }
        .item-main { display: table-cell; vertical-align: middle; }
        .item-title { font-size: 14px; font-weight: 500; }
        .item-title.strikethrough { text-decoration: line-through; color: var(--text-sub); }
        .item-meta { font-size: 11px; color: var(--text-sub); margin-top: 4px; }
        .item-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: white;
            margin-right: 4px;
            font-weight: 500;
        }
        .item-badge.ry { background-color: var(--renyu-color); }
        .item-badge.mz { background-color: var(--maozi-color); }
        .item-badge.cd { background-color: var(--card-color); }
        .item-right { display: table-cell; text-align: right; vertical-align: middle; width: 110px; }
        .item-amount { font-weight: bold; font-size: 15px; color: var(--text-main); margin-bottom: 4px; }

        .btn-audit {
            background-color: #f1f3f1;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-audit:hover { background-color: var(--primary-light); color: var(--primary); }
        .status-settled { color: var(--success-color); font-size: 11px; font-weight: 600; padding: 4px 0; }
        .pay-date-text { display: block; font-size: 9px; color: #889c89; font-weight: normal; margin-top: 1px; }
        .status-none { color: #90a4ae; font-size: 11px; font-style: italic; }
        .loading-text { text-align: center; font-size: 13px; color: var(--text-sub); padding: 16px 0; }

        /* 結算確認視窗 */
        .modal-mask {
            position: fixed;
            inset: 0;
            background: rgba(30, 40, 31, 0.5);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 100;
        }
        .modal-mask.show { display: flex; }
        .modal {
            background: #fff;
            width: 100%;
            max-width: 480px;
            max-height: 88vh;
            border-radius: 20px 20px 0 0;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-head { padding: 18px 20px 10px; }
        .modal-head h3 { font-size: 16px; }
        .modal-head p { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
        .modal-body { padding: 0 20px; overflow-y: auto; flex: 1; }
        .month-group { margin-bottom: 12px; }
        .month-head {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: 700;
            color: var(--text-sub);
            background: #f4f6f4;
            padding: 6px 10px;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        .pick-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 4px;
            border-bottom: 1px solid #edf2ee;
            font-size: 13px;
            cursor: pointer;
        }
        .pick-row input { width: 18px; height: 18px; flex-shrink: 0; }
        .pick-row .pick-name { flex: 1; min-width: 0; }
        .pick-row .pick-date { font-size: 11px; color: var(--text-sub); }
        .pick-row .pick-amt { font-weight: 700; white-space: nowrap; }
        .modal-foot { padding: 14px 20px 20px; border-top: 1px solid var(--border); }
        .modal-total { display: flex; justify-content: space-between; font-size: 15px; font-weight: 700; margin-bottom: 12px; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-actions button {
            flex: 1;
            padding: 13px;
            border-radius: 10px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-cancel { background: #eef1ee; color: var(--text-sub); }
        .btn-confirm { background: var(--renyu-color); color: #fff; }
        .btn-confirm:disabled, .btn-cancel:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>

    <header>
        <h1>🌲 毛毛宇家的金庫2.0</h1>
        <p>一起堅固我們家</p>
    </header>

    <div class="dashboard">
        <div class="total-box">
            <div class="total-label">⚖️ 家庭基金剩餘可用</div>
            <div class="total-amount">NT$ <span id="fundBalance">0</span></div>
            <div class="fund-info" id="fundInfoText">本月已花了: NT$ 0</div>
        </div>
        <div class="split-grid">
            <div class="split-col">
                <div class="member-name renyu">🌲 未結算補款 (仁宇)</div>
                <div class="member-amount" id="renyuRefund">NT$ 0</div>
                <div class="member-subnote" id="renyuNote">含所有月份</div>
                <button class="btn-settle ry" id="settleRyBtn" onclick="openSettleModal('ry')" disabled>一鍵撥款</button>
            </div>
            <div class="split-col">
                <div class="member-name maozi">🍊 未結算補款 (毛子)</div>
                <div class="member-amount" id="maoziRefund">NT$ 0</div>
                <div class="member-subnote" id="maoziNote">含所有月份</div>
                <button class="btn-settle mz" id="settleMzBtn" onclick="openSettleModal('mz')" disabled>一鍵撥款</button>
            </div>
        </div>
        <div class="settlement-alert" id="settlementText">
            正在與金庫連線中...
        </div>
    </div>

    <div class="card">
        <div class="card-title">新增花費</div>
        <form id="expenseForm">
            <div class="form-group">
                <label>付款方式</label>
                <div class="radio-group">
                    <input type="radio" id="payByRenyu" name="payer" value="仁宇代墊" checked>
                    <label for="payByRenyu" class="radio-label ry-btn">🌲 仁宇代墊</label>

                    <input type="radio" id="payByMaozi" name="payer" value="毛子代墊">
                    <label for="payByMaozi" class="radio-label mz-btn">🍊 毛子代墊</label>

                    <input type="radio" id="payByCard" name="payer" value="家庭帳戶金融卡直刷">
                    <label for="payByCard" class="radio-label cd-btn">💳 家庭帳戶金融卡</label>
                </div>
            </div>

            <div class="form-group">
                <label for="amount">金額 (NT$)</label>
                <input type="number" id="amount" class="form-control" placeholder="請輸入金額" required pattern="[0-9]*" inputmode="numeric">
            </div>

            <div class="form-group">
                <label for="purpose">品項 / 用途</label>
                <input type="text" id="purpose" class="form-control" placeholder="例如：買菜、水電費" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">紀錄一筆</button>
        </form>
    </div>

    <div class="card">
        <div class="card-title">記帳明細</div>
        <div class="tabs">
            <button class="tab-btn active" id="tabRecent" onclick="switchTab('recent')">最近 10 筆</button>
            <button class="tab-btn" id="tabUnsettled" onclick="switchTab('unsettled')">全部待撥款 (0)</button>
        </div>
        <ul class="history-list" id="historyList">
            <div class="loading-text" id="loadingText">正在讀取最新帳目...</div>
        </ul>
    </div>

    <!-- 一鍵撥款確認視窗 -->
    <div class="modal-mask" id="settleModal">
        <div class="modal">
            <div class="modal-head">
                <h3 id="settleTitle"></h3>
                <p>依月份列出所有待撥款項目，可取消勾選暫不撥款的項目。</p>
            </div>
            <div class="modal-body" id="settleBody"></div>
            <div class="modal-foot">
                <div class="modal-total">
                    <span id="settleCount">0 筆</span>
                    <span id="settleTotal">NT$ 0</span>
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel" id="settleCancel" onclick="closeSettleModal()">取消</button>
                    <button class="btn-confirm" id="settleConfirm" onclick="confirmSettle()">確認已轉帳</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwaTVZsxtJ_fUpM1Em624hvAEgvtrt0jgIjngZWPRqmKUYcnZ28McNPXA3OZoJdW64g/exec";

        /* =========================================================
         * 💰 預算設定區（原樣保留）
         * ========================================================= */
        const BUDGET_CONFIG = {
            DEFAULT_BUDGET: 20900,
            LEGACY_BUDGET: 17500,
            NEW_SYSTEM_START: "2026-06",
            OPENING_SPENT: {
                "2026-5": 16643
            }
        };

        let records = [];
        let activeTab = 'recent';     // 'recent' | 'unsettled'
        let isSettling = false;       // 結算進行中的鎖，避免連點
        let settleKind = null;        // 目前結算視窗對象 'ry' | 'mz'

        const form = document.getElementById('expenseForm');
        const submitBtn = document.getElementById('submitBtn');

        document.querySelectorAll('input[name="payer"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if (e.target.value === '仁宇代墊') {
                    submitBtn.style.backgroundColor = 'var(--renyu-color)';
                } else if (e.target.value === '毛子代墊') {
                    submitBtn.style.backgroundColor = 'var(--maozi-color)';
                } else {
                    submitBtn.style.backgroundColor = 'var(--card-color)';
                }
            });
        });

        function ymToNumber(year, month) { return year * 100 + month; }

        function getBudgetForMonth(targetYear, targetMonth) {
            const [startY, startM] = BUDGET_CONFIG.NEW_SYSTEM_START.split('-').map(Number);
            const startNum = ymToNumber(startY, startM);
            const targetNum = ymToNumber(targetYear, targetMonth);
            const total = (targetNum >= startNum) ? BUDGET_CONFIG.DEFAULT_BUDGET : BUDGET_CONFIG.LEGACY_BUDGET;
            const key = `${targetYear}-${targetMonth}`;
            const offset = BUDGET_CONFIG.OPENING_SPENT[key] || 0;
            return { total, offset, label: `${targetMonth}月基金` };
        }

        const MONTH_ABBR = {
            jan: 1, feb: 2, mar: 3, apr: 4, may: 5, jun: 6,
            jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12
        };

        // 日期解析（原樣保留）：解析不出來回傳 null
        function parseYearMonth(timeValue) {
            if (timeValue === null || timeValue === undefined || timeValue === '') return null;

            if (timeValue instanceof Date && !isNaN(timeValue.getTime())) {
                return { year: timeValue.getFullYear(), month: timeValue.getMonth() + 1 };
            }

            const str = timeValue.toString().trim();

            const numMatch = str.match(/^\s*(\d{4})\D+(\d{1,2})/);
            if (numMatch) {
                const year = parseInt(numMatch[1], 10);
                const month = parseInt(numMatch[2], 10);
                if (year >= 2000 && year <= 2100 && month >= 1 && month <= 12) return { year, month };
            }

            const abbrMatch = str.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/i);
            const yearMatch = str.match(/\b(19|20)\d{2}\b/);
            if (abbrMatch && yearMatch) {
                const month = MONTH_ABBR[abbrMatch[1].toLowerCase()];
                const year = parseInt(yearMatch[0], 10);
                if (month && year >= 2000 && year <= 2100) return { year, month };
            }

            const d = new Date(str);
            if (!isNaN(d.getTime())) return { year: d.getFullYear(), month: d.getMonth() + 1 };

            return null;
        }

        function fetchCloudData() {
            if (API_URL === "" || API_URL.includes("這裡替換成")) {
                document.getElementById('settlementText').innerText = "💡 請先在程式碼中填入你的 GAS 網址喔！";
                return Promise.resolve();
            }

            return fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    records = data;
                    const loadingText = document.getElementById('loadingText');
                    if (loadingText) loadingText.remove();
                    updateUI();
                })
                .catch(error => {
                    console.error("讀取失敗:", error);
                    document.getElementById('settlementText').innerText = "❌ 金庫讀取失敗，請重新整理";
                });
        }

        function classifyPayer(payer) {
            if (payer === '仁宇代墊' || payer === '仁宇' || payer === '老公') {
                return { displayPayer: '仁宇代墊', badgeClass: 'ry', kind: 'ry' };
            }
            if (payer === '毛子代墊' || payer === '毛子' || payer === '老婆') {
                return { displayPayer: '毛子代墊', badgeClass: 'mz', kind: 'mz' };
            }
            return { displayPayer: '家庭帳戶金融卡直刷', badgeClass: 'cd', kind: 'cd' };
        }

        // 「待撥款」的唯一判定：必須是代墊款（非金融卡）且狀態不是已撥款
        // 完全不看月份，這就是跨月結算的核心
        function isUnsettledClaim(res) {
            const { kind } = classifyPayer(res.payer);
            return (kind === 'ry' || kind === 'mz') && res.status !== '已撥款';
        }

        function getSortableTime(res) {
            if (!res || !res.time) return 0;
            const t = new Date(res.time).getTime();
            return isNaN(t) ? 0 : t;
        }

        function formatDisplayDate(timeValue) {
            if (!timeValue) return '';
            const d = new Date(timeValue);
            if (isNaN(d.getTime())) return timeValue.toString();
            const mm = String(d.getMonth() + 1).padStart(2, '0');
            const dd = String(d.getDate()).padStart(2, '0');
            const yearPrefix = d.getFullYear() !== new Date().getFullYear() ? `${d.getFullYear()}/` : '';
            return `${yearPrefix}${mm}/${dd}`;
        }

        // 月份標籤，例如 "2026/10"；解析失敗回傳 "日期未知"
        function monthLabel(res) {
            const ym = parseYearMonth(res.time);
            return ym ? `${ym.year}/${String(ym.month).padStart(2, '0')}` : '日期未知';
        }

        function escapeHtml(str) {
            return String(str == null ? '' : str)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function switchTab(tab) {
            activeTab = tab;
            document.getElementById('tabRecent').classList.toggle('active', tab === 'recent');
            document.getElementById('tabUnsettled').classList.toggle('active', tab === 'unsettled');
            updateUI();
        }

        function updateUI() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth() + 1;

            const budgetInfo = getBudgetForMonth(currentYear, currentMonth);

            let totalSpent = budgetInfo.offset;
            let ryUnpaid = 0, mzUnpaid = 0;
            let ryCount = 0, mzCount = 0;
            const unparsedRecords = [];

            /* ---------------------------------------------------------
             * 第一部分：未結算補款 —— 跨月，不看月份，只看狀態
             * （修正：以前只算當月，上月沒撥的錢會從畫面消失）
             * --------------------------------------------------------- */
            records.forEach(res => {
                if (!isUnsettledClaim(res)) return;
                const { kind } = classifyPayer(res.payer);
                if (kind === 'ry') { ryUnpaid += res.amount; ryCount++; }
                if (kind === 'mz') { mzUnpaid += res.amount; mzCount++; }
            });

            /* ---------------------------------------------------------
             * 第二部分：本月花費（基金餘額仍依「消費發生月份」計算）
             * --------------------------------------------------------- */
            records.forEach(res => {
                const ym = parseYearMonth(res.time);
                if (!ym) {
                    unparsedRecords.push(res);
                    console.warn("日期無法辨識，已略過此筆：", res);
                    return;
                }
                if (ym.year !== currentYear || ym.month !== currentMonth) return;
                totalSpent += res.amount;
            });

            /* ---------------------------------------------------------
             * 第三部分：明細列表（兩種視圖）
             * --------------------------------------------------------- */
            const unsettledAll = records.filter(isUnsettledClaim);
            document.getElementById('tabUnsettled').innerText = `全部待撥款 (${unsettledAll.length})`;

            const listElement = document.getElementById('historyList');
            listElement.innerHTML = '';

            let shown;
            if (activeTab === 'unsettled') {
                shown = [...unsettledAll].sort((a, b) => getSortableTime(b) - getSortableTime(a));
            } else {
                shown = [...records].sort((a, b) => getSortableTime(b) - getSortableTime(a)).slice(0, 10);
            }

            if (shown.length === 0) {
                listElement.innerHTML = activeTab === 'unsettled'
                    ? `<div class="loading-text">🎉 目前沒有待撥款項目</div>`
                    : `<div class="loading-text">還沒有任何記帳，來記第一筆吧！</div>`;
            } else {
                shown.forEach(res => {
                    const isSettled = res.status === '已撥款';
                    const { displayPayer, badgeClass } = classifyPayer(res.payer);

                    const li = document.createElement('li');
                    li.className = 'history-item';

                    let auditHtml = '';
                    if (displayPayer === '家庭帳戶金融卡直刷') {
                        auditHtml = `<span class="status-none">💳 無需撥款</span>`;
                    } else if (isSettled) {
                        auditHtml = `<span class="status-settled">✓ 已撥款<span class="pay-date-text">📅 ${escapeHtml(res.payDate || '已完成')}</span></span>`;
                    } else {
                        auditHtml = `<button class="btn-audit" onclick="auditRow(${Number(res.rowId)}, this)">⚙ 點擊撥款</button>`;
                    }

                    const titleClass = isSettled ? "item-title strikethrough" : "item-title";

                    li.innerHTML = `
                        <div class="item-main">
                            <div class="${titleClass}">${escapeHtml(res.purpose)}</div>
                            <div class="item-meta">
                                <span class="item-badge ${badgeClass}">${displayPayer}</span>
                                <span style="color:#a0b2a1;">${escapeHtml(formatDisplayDate(res.time))}</span>
                            </div>
                        </div>
                        <div class="item-right">
                            <div class="item-amount">NT$ ${Number(res.amount).toLocaleString()}</div>
                            <div class="audit-zone">${auditHtml}</div>
                        </div>
                    `;
                    listElement.appendChild(li);
                });
            }

            /* ---------------------------------------------------------
             * 第四部分：儀表板數字與按鈕狀態
             * --------------------------------------------------------- */
            const remainingBalance = budgetInfo.total - totalSpent;
            document.getElementById('fundBalance').innerText = remainingBalance.toLocaleString();

            let infoText = `${currentMonth}月已花了: NT$ ${totalSpent.toLocaleString()}`;
            if (unparsedRecords.length > 0) {
                infoText += ` ⚠️ 有 ${unparsedRecords.length} 筆日期無法辨識(已略過)`;
            }
            document.getElementById('fundInfoText').innerText = infoText;

            document.getElementById('renyuRefund').innerText = 'NT$ ' + ryUnpaid.toLocaleString();
            document.getElementById('maoziRefund').innerText = 'NT$ ' + mzUnpaid.toLocaleString();
            document.getElementById('renyuNote').innerText = ryCount ? `共 ${ryCount} 筆・含所有月份` : '已全數撥款';
            document.getElementById('maoziNote').innerText = mzCount ? `共 ${mzCount} 筆・含所有月份` : '已全數撥款';
            document.getElementById('settleRyBtn').disabled = ryCount === 0 || isSettling;
            document.getElementById('settleMzBtn').disabled = mzCount === 0 || isSettling;

            const settlementAlert = document.getElementById('settlementText');
            if (remainingBalance < 0) {
                settlementAlert.innerHTML = `⚠️ 警告：${currentMonth}月基金已透支 NT$ ${Math.abs(remainingBalance).toLocaleString()}！`;
                settlementAlert.style.color = '#d93636';
                settlementAlert.style.backgroundColor = '#fdebeb';
                settlementAlert.style.borderColor = '#fab8b8';
            } else {
                settlementAlert.innerHTML = `✨ 運作良好！${currentMonth}月已攜手分攤了 NT$ ${(totalSpent - budgetInfo.offset).toLocaleString()} 的家庭基建。`;
                settlementAlert.style.color = 'var(--primary)';
                settlementAlert.style.backgroundColor = 'var(--primary-light)';
                settlementAlert.style.borderColor = '#fadcc8';
            }
        }

        /* =========================================================
         * 🔁 後端呼叫：標記單筆已撥款（沿用原有 updateStatus，後端不用改）
         * ========================================================= */
        function postUpdateStatus(rowId) {
            return fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({ action: "updateStatus", rowId: rowId })
            }).then(res => res.json());
        }

        // 單筆撥款（維持原功能）
        function auditRow(rowId, buttonElement) {
            if (isSettling) return;
            if (!confirm("確定已將這筆代墊款撥款給對方了嗎？\n確認後將自動紀錄今日撥款日期。")) return;

            buttonElement.disabled = true;
            buttonElement.innerText = "同步中...";

            postUpdateStatus(rowId)
                .then(result => {
                    if (result.result === "success") {
                        const recordIndex = records.findIndex(r => Number(r.rowId) === Number(rowId));
                        if (recordIndex !== -1) {
                            records[recordIndex].status = "已撥款";
                            records[recordIndex].payDate = result.payDate;
                        }
                        updateUI();
                    } else {
                        alert("核銷失敗，請重試！");
                        buttonElement.disabled = false;
                        buttonElement.innerText = "⚙ 點擊撥款";
                    }
                })
                .catch(err => {
                    console.error("同步失敗:", err);
                    alert("網路異常");
                    buttonElement.disabled = false;
                    buttonElement.innerText = "⚙ 點擊撥款";
                });
        }

        /* =========================================================
         * 🧾 一鍵撥款（跨月）
         * ---------------------------------------------------------
         * 設計重點：
         *  1. 以「人」為單位，撈出該人所有未撥款項目，不分月份。
         *  2. 確認視窗依月份分組列出，每筆可取消勾選。
         *  3. 送出的是「勾選的 rowId 清單」，不是「全部未撥款」，
         *     所以按下前一刻別人新增的項目不會被誤核銷。
         *  4. 送出前先重新抓一次最新資料，剔除已被別人撥款的項目，
         *     避免兩個人同時操作造成重複撥款。
         *  5. 逐筆送出（沿用既有 updateStatus），失敗就停下並回報進度。
         * ========================================================= */
        function openSettleModal(kind) {
            if (isSettling) return;
            settleKind = kind;

            const items = records
                .filter(r => isUnsettledClaim(r) && classifyPayer(r.payer).kind === kind)
                .sort((a, b) => getSortableTime(a) - getSortableTime(b));
            if (items.length === 0) return;

            const name = kind === 'ry' ? '🌲 仁宇' : '🍊 毛子';
            document.getElementById('settleTitle').innerText = `一鍵撥款給 ${name}`;

            // 依月份分組（保持時間順序）
            const groups = new Map();
            items.forEach(r => {
                const label = monthLabel(r);
                if (!groups.has(label)) groups.set(label, []);
                groups.get(label).push(r);
            });

            let html = '';
            groups.forEach((rows, label) => {
                html += `<div class="month-group" data-month="${escapeHtml(label)}">
                    <div class="month-head"><span>${escapeHtml(label)}</span><span class="month-sub"></span></div>`;
                rows.forEach(r => {
                    html += `<label class="pick-row">
                        <input type="checkbox" checked data-row-id="${Number(r.rowId)}" data-amount="${Number(r.amount)}" onchange="recalcSettle()">
                        <span class="pick-name">${escapeHtml(r.purpose)}<br><span class="pick-date">${escapeHtml(formatDisplayDate(r.time))}</span></span>
                        <span class="pick-amt">NT$ ${Number(r.amount).toLocaleString()}</span>
                    </label>`;
                });
                html += `</div>`;
            });
            document.getElementById('settleBody').innerHTML = html;

            recalcSettle();
            document.getElementById('settleModal').classList.add('show');
        }

        function closeSettleModal() {
            if (isSettling) return;
            document.getElementById('settleModal').classList.remove('show');
        }

        // 重新計算各月小計與總額
        function recalcSettle() {
            let total = 0, count = 0;
            document.querySelectorAll('#settleBody .month-group').forEach(group => {
                let sub = 0, n = 0;
                group.querySelectorAll('input[type=checkbox]').forEach(cb => {
                    if (cb.checked) { sub += Number(cb.dataset.amount); n++; }
                });
                group.querySelector('.month-sub').innerText = `${n} 筆 · NT$ ${sub.toLocaleString()}`;
                total += sub; count += n;
            });
            document.getElementById('settleCount').innerText = `共 ${count} 筆`;
            document.getElementById('settleTotal').innerText = `NT$ ${total.toLocaleString()}`;
            document.getElementById('settleConfirm').disabled = count === 0;
        }

        async function confirmSettle() {
            if (isSettling) return;

            const selected = Array.from(document.querySelectorAll('#settleBody input[type=checkbox]:checked'))
                .map(cb => Number(cb.dataset.rowId));
            if (selected.length === 0) return;

            const totalText = document.getElementById('settleTotal').innerText;
            if (!confirm(`確認已轉帳 ${totalText}（${selected.length} 筆）？\n按下後將依序標記為已撥款並記錄今日日期。`)) return;

            isSettling = true;
            const confirmBtn = document.getElementById('settleConfirm');
            const cancelBtn = document.getElementById('settleCancel');
            confirmBtn.disabled = true;
            cancelBtn.disabled = true;
            confirmBtn.innerText = "確認最新資料...";
            document.getElementById('settleRyBtn').disabled = true;
            document.getElementById('settleMzBtn').disabled = true;

            let done = 0;
            let skipped = 0;
            let failedAt = null;

            try {
                // 先抓最新資料，剔除已被別人撥款的項目
                const fresh = await fetch(API_URL).then(r => r.json());
                const stillOpen = new Set(fresh.filter(isUnsettledClaim).map(r => Number(r.rowId)));
                const ids = selected.filter(id => stillOpen.has(id));
                skipped = selected.length - ids.length;

                for (let i = 0; i < ids.length; i++) {
                    confirmBtn.innerText = `同步中 ${i + 1} / ${ids.length}`;
                    const result = await postUpdateStatus(ids[i]);
                    if (result.result !== "success") { failedAt = i; break; }
                    done++;
                }

                if (failedAt !== null) {
                    alert(`撥款中斷：已完成 ${done} 筆，第 ${done + 1} 筆失敗。\n已完成的不會重複，請重新點擊一鍵撥款處理剩餘項目。`);
                } else if (skipped > 0) {
                    alert(`已完成 ${done} 筆。\n另有 ${skipped} 筆剛剛已被其他人撥款，已自動略過。`);
                }
            } catch (err) {
                console.error("一鍵撥款失敗:", err);
                alert(`網路異常：已完成 ${done} 筆。\n請重新整理確認狀態後再試。`);
            } finally {
                isSettling = false;
                confirmBtn.innerText = "確認已轉帳";
                cancelBtn.disabled = false;
                document.getElementById('settleModal').classList.remove('show');
                await fetchCloudData();   // 重新讀取，以後端實際狀態為準
            }
        }

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const payer = document.querySelector('input[name="payer"]:checked').value;
            const amount = parseInt(document.getElementById('amount').value, 10);
            const purpose = document.getElementById('purpose').value;

            if (!amount || !purpose) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "正在同步至金庫...";

            const newData = { payer, amount, purpose };

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(newData)
            })
            .then(res => res.json())
            .then(result => {
                if (result.result === "success") {
                    fetchCloudData();
                    document.getElementById('amount').value = '';
                    document.getElementById('purpose').value = '';
                } else {
                    alert("儲存失敗，請重試！");
                }
            })
            .catch(err => {
                console.error("同步失敗:", err);
                alert("連線異常");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "紀錄一筆";
            });
        });

        fetchCloudData();
    </script>
</body>
</html>
