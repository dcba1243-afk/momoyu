<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛毛宇家的金庫2.0</title>
    <style>
        :root {
            --bg-color: #f4f6f4;          /* 淡淡的森林大地灰綠 */
            --card-bg: #ffffff;
            --text-main: #2d3a2e;         /* 深橡木綠 */
            --text-sub: #607261;          /* 苔蘚綠 */
            --primary: #d97736;           /* 松果暖橘 */
            --primary-light: #fdf2eb;     /* 暖橘淡背景 */
            --renyu-color: #4a7c59;       /* 仁宇：常青樹綠 */
            --maozi-color: #e28743;       /* 毛子：秋楓橘 */
            --card-color: #5b8296;        /* 家庭帳戶金融卡：莫蘭迪藍 */
            --success-color: #2b8a3e;     /* 已核銷綠 */
            --border: #e2ede4;            /* 淺綠邊框 */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 16px;
            max-width: 480px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 24px 0;
        }

        header h1 {
            font-size: 22px;
            color: var(--text-main);
            letter-spacing: 1.5px;
            font-weight: 700;
        }

        header p {
            font-size: 13px;
            color: var(--text-sub);
            margin-top: 6px;
            letter-spacing: 0.5px;
        }

        /* 儀表板與結算區 */
        .dashboard {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(45, 58, 46, 0.04);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .total-box {
            text-align: center;
            margin-bottom: 16px;
            padding-bottom: 16px;
            border-bottom: 1px dashed var(--border);
        }

        .total-label {
            font-size: 13px;
            color: var(--text-sub);
        }

        .total-amount {
            font-size: 30px;
            font-weight: bold;
            color: var(--primary);
            margin-top: 4px;
        }

        .fund-info {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .split-grid {
            display: table;
            width: 100%;
            margin-bottom: 12px;
        }

        .split-col {
            display: table-cell;
            width: 50%;
            text-align: center;
        }

        .split-col:first-child {
            border-right: 1px solid var(--border);
        }

        .member-name {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .member-name.renyu { color: var(--renyu-color); }
        .member-name.maozi { color: var(--maozi-color); }

        .member-amount {
            font-size: 18px;
            font-weight: bold;
        }
        
        .member-subnote {
            font-size: 10px;
            color: var(--text-sub);
            margin-top: 2px;
        }

        .settlement-alert {
            background-color: var(--primary-light);
            border-radius: 8px;
            padding: 12px;
            text-align: center;
            font-size: 13px;
            color: var(--primary);
            font-weight: 600;
            margin-top: 8px;
            border: 1px solid #fadcc8;
        }

        /* 表單區 */
        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 16px rgba(45, 58, 46, 0.04);
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 16px;
            color: var(--text-main);
            border-left: 4px solid var(--renyu-color);
            padding-left: 8px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            color: var(--text-sub);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fafbfa;
            outline: none;
            transition: all 0.2s;
        }

        .form-control:focus {
            border-color: var(--renyu-color);
            background-color: #fff;
            box-shadow: 0 0 0 3px rgba(74, 124, 89, 0.1);
        }

        .radio-group {
            display: flex;
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border);
        }

        .radio-label {
            flex: 1;
            text-align: center;
            padding: 12px 4px;
            cursor: pointer;
            font-size: 13px;
            background: #fff;
            font-weight: 500;
            transition: all 0.2s;
            border-right: 1px solid var(--border);
        }

        .radio-label:last-child {
            border-right: none;
        }

        input[type="radio"] {
            display: none;
        }

        input[type="radio"]:checked + .radio-label.ry-btn {
            background-color: var(--renyu-color);
            color: white;
            border-color: var(--renyu-color);
        }

        input[type="radio"]:checked + .radio-label.mz-btn {
            background-color: var(--maozi-color);
            color: white;
            border-color: var(--maozi-color);
        }

        input[type="radio"]:checked + .radio-label.cd-btn {
            background-color: var(--card-color);
            color: white;
            border-color: var(--card-color);
        }

        .btn-submit {
            width: 100%;
            background-color: var(--renyu-color); 
            color: white;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(74, 124, 89, 0.15);
            transition: all 0.2s;
        }

        .btn-submit:active {
            background-color: #3b6347;
        }

        .btn-submit:disabled {
            background-color: var(--text-sub);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* 歷史明細 */
        .history-list {
            list-style: none;
        }

        .history-item {
            display: table;
            width: 100%;
            padding: 14px 0;
            border-bottom: 1px solid #edf2ee;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .item-main {
            display: table-cell;
            vertical-align: middle;
        }

        .item-title {
            font-size: 14px;
            font-weight: 500;
        }
        
        .item-title.strikethrough {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .item-meta {
            font-size: 11px;
            color: var(--text-sub);
            margin-top: 4px;
        }

        .item-badge {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            color: white;
            margin-right: 4px;
            font-weight: 500;
        }

        .item-badge.ry { background-color: var(--renyu-color); }
        .item-badge.mz { background-color: var(--maozi-color); }
        .item-badge.cd { background-color: var(--card-color); }

        .item-right {
            display: table-cell;
            text-align: right;
            vertical-align: middle;
            width: 110px;
        }

        .item-amount {
            font-weight: bold;
            font-size: 15px;
            color: var(--text-main);
            margin-bottom: 4px;
        }
        
        /* 審核按鈕樣式 */
        .btn-audit {
            background-color: #f1f3f1;
            border: 1px solid var(--border);
            color: var(--text-sub);
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .btn-audit:hover {
            background-color: var(--primary-light);
            color: var(--primary);
        }
        
        .status-settled {
            color: var(--success-color);
            font-size: 11px;
            font-weight: 600;
            padding: 4px 0;
        }
        
        .pay-date-text {
            display: block;
            font-size: 9px;
            color: #889c89;
            font-weight: normal;
            margin-top: 1px;
        }
        
        .status-none {
            color: #90a4ae;
            font-size: 11px;
            font-style: italic;
        }
        
        .loading-text {
            text-align: center;
            font-size: 13px;
            color: var(--text-sub);
            padding: 16px 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌲 毛毛宇家的金庫2.0</h1>
        <p>一起堅固我們家</p>
    </header>

    <div class="dashboard">
        <div class="total-box">
            <div class="total-label">⚖️ 家庭基金剩餘可用</div>
            <div class="total-amount">NT$ <span id="fundBalance">0</span></div>
            <div class="fund-info" id="fundInfoText">本月基金總額: NT$ --</div>
        </div>
        <div class="split-grid">
            <div class="split-col">
                <div class="member-name renyu">🌲 未結算補款 (仁宇)</div>
                <div class="member-amount" id="renyuRefund">NT$ 0</div>
                <div class="member-subnote">已扣除已撥款項</div>
            </div>
            <div class="split-col">
                <div class="member-name maozi">🍊 未結算補款 (毛子)</div>
                <div class="member-amount" id="maoziRefund">NT$ 0</div>
                <div class="member-subnote">已扣除已撥款項</div>
            </div>
        </div>
        <div class="settlement-alert" id="settlementText">
            正在與金庫連線中...
        </div>
    </div>

    <div class="card">
        <div class="card-title">新增花費</div>
        <form id="expenseForm">
            <div class="form-group">
                <label>付款方式</label>
                <div class="radio-group">
                    <input type="radio" id="payByRenyu" name="payer" value="仁宇代墊" checked>
                    <label for="payByRenyu" class="radio-label ry-btn">🌲 仁宇代墊</label>
                    
                    <input type="radio" id="payByMaozi" name="payer" value="毛子代墊">
                    <label for="payByMaozi" class="radio-label mz-btn">🍊 毛子代墊</label>

                    <input type="radio" id="payByCard" name="payer" value="家庭帳戶金融卡直刷">
                    <label for="payByCard" class="radio-label cd-btn">💳 家庭帳戶金融卡</label>
                </div>
            </div>

            <div class="form-group">
                <label for="amount">金額 (NT$)</label>
                <input type="number" id="amount" class="form-control" placeholder="請輸入金額" required pattern="[0-9]*" inputmode="numeric">
            </div>

            <div class="form-group">
                <label for="purpose">品項 / 用途</label>
                <input type="text" id="purpose" class="form-control" placeholder="例如：買菜、水電費" required>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">紀錄一筆</button>
        </form>
    </div>

    <div class="card">
        <div class="card-title">最近記帳明細 (點擊核銷可立即發錢)</div>
        <ul class="history-list" id="historyList">
            <div class="loading-text" id="loadingText">正在讀取最新帳目...</div>
        </ul>
    </div>

    <script>
        // 專屬 GAS 連線 API 網址
        const API_URL = "https://script.google.com/macros/s/AKfycbwaTVZsxtJ_fUpM1Em624hvAEgvtrt0jgIjngZWPRqmKUYcnZ28McNPXA3OZoJdW64g/exec";
        
        let records = [];
        const form = document.getElementById('expenseForm');
        const submitBtn = document.getElementById('submitBtn');

        // 按鈕視覺顏色切換
        document.querySelectorAll('input[name="payer"]').forEach(radio => {
            radio.addEventListener('change', (e) => {
                if(e.target.value === '仁宇代墊') {
                    submitBtn.style.backgroundColor = 'var(--renyu-color)';
                } else if(e.target.value === '毛子代墊') {
                    submitBtn.style.backgroundColor = 'var(--maozi-color)';
                } else {
                    submitBtn.style.backgroundColor = 'var(--card-color)';
                }
            });
        });

        // 動態計算當月理財基金總額
        function getBudgetForCurrentMonth() {
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth() + 1;

            if (year > 2026 || (year === 2026 && month >= 6)) {
                return { total: 20900, text: "6月新制 (13,200 + 7,700)" };
            } else {
                // 🛠️ 精準修正：將五月基底調整為 857 元，確保無開銷時完美顯示 857
                return { total: 857, text: "5月舊制 (餘額調整版)" };
            }
        }

        function fetchCloudData() {
            if(API_URL === "" || API_URL.includes("這裡替換成")) {
                document.getElementById('settlementText').innerText = "💡 請先在程式碼中填入你的 GAS 網址喔！";
                return;
            }
            
            fetch(API_URL)
                .then(response => response.json())
                .then(data => {
                    records = data;
                    const loadingText = document.getElementById('loadingText');
                    if(loadingText) loadingText.remove();
                    updateUI();
                })
                .catch(error => {
                    console.error("讀取失敗:", error);
                    document.getElementById('settlementText').innerText = "❌ 金庫讀取失敗，請重新整理";
                });
        }
        
        function updateUI() {
            let totalSpent = 0;   // 基金總花費 (不論是否撥款)
            let ryUnpaid = 0;     // 仁宇「尚未被撥款」的代墊款
            let mzUnpaid = 0;     // 毛子「尚未被撥款」的代墊款
            
            const listElement = document.getElementById('historyList');
            listElement.innerHTML = '';

            if (records.length === 0) {
                listElement.innerHTML = '<div class="loading-text">目前金庫空空如也，來記第一筆吧！</div>';
            }

            records.forEach(res => {
                let displayPayer = res.payer;
                let badgeClass = 'cd';
                let isSettled = res.status === '已撥款';

                // 計算開銷
                totalSpent += res.amount;

                // 只有「未撥款」的墊付才會出現在上方的「應補款金額」看板中
                if(res.payer === '仁宇代墊' || res.payer === '仁宇' || res.payer === '老公') {
                    displayPayer = '仁宇代墊';
                    badgeClass = 'ry';
                    if (!isSettled) ryUnpaid += res.amount;
                } else if(res.payer === '毛子代墊' || res.payer === '毛子' || res.payer === '老婆') {
                    displayPayer = '毛子代墊';
                    badgeClass = 'mz';
                    if (!isSettled) mzUnpaid += res.amount;
                } else {
                    displayPayer = '家庭帳戶金融卡直刷';
                    badgeClass = 'cd';
                }

                const li = document.createElement('li');
                li.className = 'history-item';
                
                // 處理右側核銷稽核按鈕/狀態的 HTML
                let auditHtml = '';
                if (displayPayer === '家庭帳戶金融卡直刷') {
                    auditHtml = `<span class="status-none">💳 無需撥款</span>`;
                } else if (isSettled) {
                    auditHtml = `<span class="status-settled">✓ 已撥款<span class="pay-date-text">📅 ${res.payDate || '已完成'}</span></span>`;
                } else {
                    auditHtml = `<button class="btn-audit" onclick="auditRow(${res.rowId}, this)">⚙ 點擊撥款</button>`;
                }

                // 如果已經核銷撥款，字體加上刪除線淡化
                const titleClass = isSettled ? "item-title strikethrough" : "item-title";

                li.innerHTML = `
                    <div class="item-main">
                        <div class="item-title ${titleClass}">${res.purpose}</div>
                        <div class="item-meta">
                            <span class="item-badge ${badgeClass}">${displayPayer}</span>
                            <span style="color:#a0b2a1;">${res.time}</span>
                        </div>
                    </div>
                    <div class="item-right">
                        <div class="item-amount">NT$ ${res.amount.toLocaleString()}</div>
                        <div class="audit-zone">${auditHtml}</div>
                    </div>
                `;
                listElement.appendChild(li);
            });

            // 算預算
            const budgetInfo = getBudgetForCurrentMonth();
            const remainingBalance = budgetInfo.total - totalSpent;

            // 顯示至看板
            document.getElementById('fundBalance').innerText = remainingBalance.toLocaleString();
            
            // 修正顯示文字
            if (budgetInfo.total === 857) {
                document.getElementById('fundInfoText').innerText = `本月剩餘鎖定額度 (修正目標：857)`;
            } else {
                document.getElementById('fundInfoText').innerText = `本月基金配額: NT$ ${budgetInfo.total.toLocaleString()} (${budgetInfo.text})`;
            }
            
            document.getElementById('renyuRefund').innerText = 'NT$ ' + ryUnpaid.toLocaleString();
            document.getElementById('maoziRefund').innerText = 'NT$ ' + mzUnpaid.toLocaleString();

            const settlementAlert = document.getElementById('settlementText');
            if (remainingBalance < 0) {
                settlementAlert.innerHTML = `⚠️ 警告：基金已透支 NT$ ${Math.abs(remainingBalance).toLocaleString()}！`;
                settlementAlert.style.color = '#d93636';
                settlementAlert.style.backgroundColor = '#fdebeb';
                settlementAlert.style.borderColor = '#fab8b8';
            } else {
                settlementAlert.innerHTML = `✨ 運作良好！本月已攜手分攤了 NT$ ${totalSpent.toLocaleString()} 的家庭基建。`;
                settlementAlert.style.color = 'var(--primary)';
                settlementAlert.style.backgroundColor = 'var(--primary-light)';
                settlementAlert.style.borderColor = '#fadcc8';
            }
        }

        // 網頁端點擊「確認撥款」觸發的雲端同步異步函式
        function auditRow(rowId, buttonElement) {
            if(!confirm("確定已將這筆代墊款撥款給對方了嗎？\n確認後將自動紀錄今日撥款日期。")) return;
            
            buttonElement.disabled = true;
            buttonElement.innerText = "同步中...";
            
            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify({
                    action: "updateStatus",
                    rowId: rowId
                })
            })
            .then(res => res.json())
            .then(result => {
                if(result.result === "success") {
                    const recordIndex = records.findIndex(r => r.rowId === rowId);
                    if(recordIndex !== -1) {
                        records[recordIndex].status = "已撥款";
                        records[recordIndex].payDate = result.payDate;
                    }
                    updateUI();
                } else {
                    alert("核銷失敗，請重試！");
                    buttonElement.disabled = false;
                    buttonElement.innerText = "⚙ 點擊撥款";
                }
            })
            .catch(err => {
                console.error("同步失敗:", err);
                alert("網路異常，無法將核銷狀態寫回試算表");
                buttonElement.disabled = false;
                buttonElement.innerText = "⚙ 點擊撥款";
            });
        }

        // 新增記帳表單送出
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const payer = document.querySelector('input[name="payer"]:checked').value;
            const amount = parseInt(document.getElementById('amount').value, 10);
            const purpose = document.getElementById('purpose').value;

            if(!amount || !purpose) return;

            submitBtn.disabled = true;
            submitBtn.innerText = "正在同步至金庫...";

            const newData = { payer, amount, purpose };

            fetch(API_URL, {
                method: "POST",
                body: JSON.stringify(newData)
            })
            .then(res => res.json())
            .then(result => {
                if(result.result === "success") {
                    fetchCloudData();
                    document.getElementById('amount').value = '';
                    document.getElementById('purpose').value = '';
                } else {
                    alert("儲存失敗，請重試！");
                }
            })
            .catch(err => {
                console.error("同步失敗:", err);
                alert("連線異常，資料未存入試算表");
            })
            .finally(() => {
                submitBtn.disabled = false;
                submitBtn.innerText = "紀錄一筆";
            });
        });

        fetchCloudData();
    </script>
</body>
</html>
